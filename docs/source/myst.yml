version: 1
project:
  title: CyteBase
  short_title: Overview
  description: Search a catalog of public single-cell datasets and open them as cloud-hosted
    CyteArc DataStores.
  github: https://github.com/NygenAnalytics/CyteBase
  plugins:
  - type: executable
    path: ../render_outputs.py
  exclude:
  - reference/api/**
  static_files:
  - llms.txt
  - ../build/api
  toc:
  - file: index.md
  - title: Getting started
    children:
    - file: installation.md
      title: Installation
    - file: tutorials/cytebase.ipynb
      title: Explore CyteBase
    - file: analyze_with_cytearc.md
      title: Analyze with CyteArc
  - title: Case studies
    children:
    - file: tutorials/cytebase_covid19.ipynb
      title: COVID-19 blood
    - url: https://docs.nygen.io/CyteArc/tutorials/composite-datasets
      title: Joint reanalysis in CyteArc
  - title: Reference
    children:
    - title: API reference
      url: /api/index.html
      open_in_same_tab: true
    - url: https://docs.nygen.io/CyteArc/
      title: CyteArc documentation
    - url: https://github.com/NygenAnalytics/CyteBase/issues
      title: Report a bug
  - title: Developers
    children:
    - file: developers/build_pipeline.md
      title: Build pipeline
site:
  template: https://github.com/myst-templates/book-theme/archive/23f2df5493e23dfb1d9433c8aa64c87beb4232a3.zip
  parts:
    primary_sidebar_footer: <!-- No sidebar footer. -->
    footer: '<a class="docs-home-link" href="https://docs.nygen.io/"><img class="brand-symbol" src="https://docs.nygen.io/assets/brand/logo/nygen-symbol.svg" alt="Nygen documentation home" width="32" height="32"></a>'
  options:
    folders: true
    style: https://docs.nygen.io/assets/brand/myst.css
    favicon: https://docs.nygen.io/assets/brand/logo/cytebase.ico
    logo: https://docs.nygen.io/assets/brand/logo/cytebase.svg
    logo_dark: https://docs.nygen.io/assets/brand/logo/cytebase.svg
    logo_alt: CyteBase
    logo_text: CyteBase
    hide_authors: true
